[project]
name = "vamface-mcp"
dynamic = ["version"]
description = "MCP server for automating face creation in Virt-A-Mate 1.22 from photos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Real identity-similarity scoring for the fitting loop.
fit = [
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    "cma>=3.3",
]
# anime 素材的 landmark 几何打分器(style=anime / auto)。
anime = [
    "animeface>=1.1",
]
# Local web GUI (vamface-gui).
gui = [
    "gradio>=4.0",
    "matplotlib>=3.7",
]

[project.scripts]
vamface-mcp = "vamface_mcp.server:main"
vamface-fit = "vamface_mcp.fit_cli:main"
vamface-gui = "vamface_mcp.gui:main"
vamface-mock = "vamface_mcp.mock_vam:main"

[tool.setuptools.dynamic]
version = {attr = "vamface_mcp.__version__"}

[tool.setuptools.package-data]
vamface_mcp = ["resources/*.cs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vamface_mcp*"]
