name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # mock VaM 让测试只依赖 numpy/pillow(base)+ cma(优化器),
      # 不装 insightface/onnxruntime/gradio 这些重依赖也能跑全量。
      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cma pytest

      - name: Test
        working-directory: server
        run: python -m pytest tests/ -q
